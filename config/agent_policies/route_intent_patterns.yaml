# 以下结构规则只保存词汇和边界；匹配、否定处理和风险裁决仍由通用求值器实现。
external_operation:
  actions: [打开, 启动, 发送, 删除, 修改, 编辑, 创建, 添加, 取消, 安排, 设置]
  targets: [应用, 软件, 浏览器, 网页, 邮件, 日程, 日历, 待办, 数据库, 系统, 文件, 文档, 平台, 服务]
  followup_actions: [更新, 同步, 提交, 推送, 发布, 写入]
  max_gap: 32
multi_operation:
  actions: [读取, 分析, 提取, 先]
  connectors: [并, 再, 然后]
  followup_actions: [核对, 检查, 发送, 写入, 修改, 导出]
  max_gap: 80
stateful_reasoning:
