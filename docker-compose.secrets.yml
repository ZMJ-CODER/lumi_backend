# 可选叠加：用 Docker secrets 注入敏感配置（替代 .env 明文密钥）
#
# 用法：
#   mkdir -p secrets
#   openssl rand -base64 48 > secrets/JWT_SECRET_KEY
#   openssl rand -base64 32 > secrets/MEMORY_ENCRYPTION_KEY
#   printf '%s' 'sk-xxx' > secrets/DEEPSEEK_API_KEY
#   printf '%s' 'sk-xxx' > secrets/QWEN_API_KEY
#   printf '%s' 'tvly-xxx' > secrets/TAVILY_API_KEY
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# 容器内文件挂载到 /run/secrets/<字段名>，后端 config 启动时自动读取并覆盖环境变量。
# 轮换密钥：更新 secrets 文件内容后 `docker compose ... up -d` 重建容器即可。

services:
  api:
    secrets:
      - JWT_SECRET_KEY
      - MEMORY_ENCRYPTION_KEY
      - DEEPSEEK_API_KEY
      - QWEN_API_KEY
      - TAVILY_API_KEY
  worker:
    secrets:
      - JWT_SECRET_KEY
      - MEMORY_ENCRYPTION_KEY
      - DEEPSEEK_API_KEY
      - QWEN_API_KEY
      - TAVILY_API_KEY
  beat:
    secrets:
      - JWT_SECRET_KEY
      - MEMORY_ENCRYPTION_KEY
      - DEEPSEEK_API_KEY
      - QWEN_API_KEY
      - TAVILY_API_KEY

secrets:
  JWT_SECRET_KEY:
    file: ./secrets/JWT_SECRET_KEY
  MEMORY_ENCRYPTION_KEY:
    file: ./secrets/MEMORY_ENCRYPTION_KEY
  DEEPSEEK_API_KEY:
    file: ./secrets/DEEPSEEK_API_KEY
  QWEN_API_KEY:
    file: ./secrets/QWEN_API_KEY
  TAVILY_API_KEY:
    file: ./secrets/TAVILY_API_KEY
