services:
  # ── PostgreSQL (含 pgvector 扩展) ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumi_db
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (缓存 + Celery broker/backend) ──
  redis:
    image: redis:7-alpine
    container_name: lumi-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── FastAPI 后端服务 ──
  api:
    build: .
    container_name: lumi-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的 localhost 主机为容器服务名
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lumi_db
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 本地查询重写小模型（Ollama 在 Windows 宿主）：容器内 localhost 到不了宿主，用 host.docker.internal
      RAG_QUERY_REWRITE_BASE_URL: http://host.docker.internal:11434/v1
      # 本地 TTS 走 compose 内的 tts 服务
      TTS_LOCAL_URL: http://tts:8765/tts
      # 当前 Compose 未部署 Temporal server。默认使用本地 DAG；本地验证
      # 清单 Temporal 运行时请使用 docker-compose.temporal.yml 并显式设置
      # AGENT_ORCHESTRATION=manifest_temporal。
      AGENT_ORCHESTRATION: "${AGENT_ORCHESTRATION:-legacy}"
      TEMPORAL_RUN_WORKER_INPROCESS: "${TEMPORAL_RUN_WORKER_INPROCESS:-false}"
      TEMPORAL_AUTO_START_SERVER: "${TEMPORAL_AUTO_START_SERVER:-false}"
    ports:
      - "8000:8000"
    # appuser 通过宿主 Docker socket 的组 GID 访问 daemon。Linux 部署前执行
    # ``export DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)``；Docker Desktop
    # 常见为 0。未匹配时 python_exec 会安全隐藏，不会回退为本地执行。
    group_add:
      - "${DOCKER_GID:-0}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./plugins:/app/plugins
      # 脚本沙箱需经 Docker CLI 创建一次性受限容器。Docker socket 等同宿主机高权限：
      # 仅用于受信任的自托管部署；公网多租户应改为独立 sandbox service。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery durable worker（文档解析/入库等不能丢的工作） ──
  worker:
    build: .
    container_name: lumi-worker
    command: celery -A celery_app.celery_app worker --loglevel=info -Q durable --hostname=durable@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lumi_db
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 本地推理依赖的模型缓存目录
      EMBEDDING_CACHE_DIR: /app/data/models
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Temporal/legacy worker 也可能执行 python_exec，必须有同一受限沙箱通道。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # LLM 辅助记忆与摘要可延后补偿，不能挤占文档入库 worker。
  worker-best-effort:
    build: .
    container_name: lumi-worker-best-effort
    command: celery -A celery_app.celery_app worker --loglevel=info -Q best_effort --hostname=best-effort@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lumi_db
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # 低优先级扫描、清理和聚合独立运行，避免高峰期反向拖慢用户上传。
  worker-maintenance:
    build: .
    container_name: lumi-worker-maintenance
    command: celery -A celery_app.celery_app worker --loglevel=info -Q maintenance --hostname=maintenance@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lumi_db
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat (定时任务调度：画像重建 / 记忆清理) ──
  beat:
    build: .
    container_name: lumi-beat
    command: celery -A celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lumi_db
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # 仅构建目标：生成 python_exec 使用的一次性隔离沙箱镜像，不常驻运行。
  # 执行 docker compose --profile sandbox build sandbox-image 后，API/worker 才会
  # 把 python_exec 暴露给模型。
  sandbox-image:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: lumi-python-sandbox:latest
    command: ["python", "-c", "print('sandbox image ready')"]
    restart: "no"

  # ── 本地 TTS 服务 (qwen3-tts / MLX CUDA，可选) ──
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    container_name: lumi-tts
    environment:
      # qwen3-tts 首次合成需下载 MLX 模型，走国内镜像（直连 HuggingFace 被墙）
      HF_ENDPOINT: https://hf-mirror.com
      # hf-mirror 不支持 Xet 加速通道（会 401），禁用后走普通 HTTP 下载
      HF_HUB_DISABLE_XET: "1"
      # Docker Desktop (WSL2) 下 CUDA 驱动库所在路径，手动挂载并加入库搜索路径；
      # 若迁移到真实 Linux 服务器，删掉下面这行和下方 /usr/lib/wsl/lib 挂载，
      # nvidia-container-toolkit 会自动完成驱动库注入
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
    ports:
      - "8765:8765"
    volumes:
      # 模型缓存持久化：避免每次重建镜像都重新下载 2.4GB 模型
      - tts_model_cache:/home/appuser/.cache/huggingface
      # Docker Desktop (WSL2) 需手动挂载 NVIDIA 驱动库，容器内才有 libcuda
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - api
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  tts_model_cache:
