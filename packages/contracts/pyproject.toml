[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-contracts"
version = "0.1.0"
description = "Versioned cross-module contracts for Lumi (tools, results, events, projections)"
requires-python = "==3.13.*"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
