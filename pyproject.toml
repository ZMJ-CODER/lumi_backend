[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-backend"
version = "0.1.0"
description = "Lumi multi-agent backend service"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "captcha>=0.6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=1.0.0",
    # mcp 2.x API 有破坏性变更；manager.py 基于 1.x 的 streamable_http_client 实现
    "mcp>=1.29.0,<2.0.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "content>=0.0.1",
    "sentence-transformers>=5.7.0",
    # CUDA 版 torch 仅通过 [tool.uv.sources] 在 Windows 上使用（本地 GPU 加速）；
    # Linux/CI/Docker 走公开索引的 CPU 版本，保证 pip / uv --no-sources 可解析
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "docling>=2.118.0",
    "pypdf>=5.0.0",
    "striprtf>=0.0.20",
    # 新建办公文档的受控渲染器：Docker 通过 `pip install .` 安装，不能只依赖 uv.lock 的间接依赖。
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "jieba>=0.42.1",
    # ── 语音（ASR + TTS 兜底）──
    "openai-whisper>=20250625",
    "edge-tts>=7.0",
    "dashscope>=1.20",
    "imageio-ffmpeg>=0.5",
    "pytest>=9.1.1",
    "temporalio>=1.31.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "sentry-sdk>=2.68.0",
    "prometheus-client>=0.26.0",
    "flagembedding>=1.4.0",
    # Routing policy files are explicit runtime input, not an accidental
    # transitive dependency of another package.
    "PyYAML>=6.0",
    # Business adapters import the deterministic kernel through the local
    # workspace package; Docker installs it before this application package.
    "lumi-orchestration>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]
rag-eval = [
    "beir>=2.2.0",
    "datasets>=3.0.0",
    "FlagEmbedding>=1.3.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 不强制默认索引为国内镜像：CI（GitHub Actions）访问清华源会 403。
# 本机想用镜像时通过环境变量覆盖：UV_DEFAULT_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple

[tool.uv.sources]
# The kernel is versioned with this backend but has its own package boundary.
# Workspace membership keeps local and CI resolution consistent.
lumi-orchestration = { workspace = true }
# torch 必须用 CUDA 版（PyPI 上是 CPU 版，uv sync 会把它覆盖导致嵌入模型无法用 GPU）
# 仅 Windows 本地生效；Linux（CI/Docker）从索引解析 CPU 版
torch = [
  { url = "https://mirrors.aliyun.com/pytorch-wheels/cu126/torch-2.13.0%2Bcu126-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { url = "https://mirrors.aliyun.com/pytorch-wheels/cu126/torchvision-0.28.0%2Bcu126-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[tool.uv]
# 本项目只面向 Windows 桌面端 + Linux 服务器，跳过 macOS 环境解析，
# 避免 uv 全平台锁定时因 +cu126 没有 darwin wheel 而失败
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]

[tool.uv.workspace]
members = ["packages/orchestration"]

[tool.setuptools.packages.find]
include = ["app*", "celery_app*"]
exclude = ["tests*", "scripts*", "tools*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# 收敛到"正确性"类规则：语法/未使用/未定义/常见 bug。
# 移除 I(import 排序)、N(命名风格)、UP(pyupgrade 现代化)、SIM(简化建议) 等
# 纯风格化/大规模重构类规则——本代码库历史积累量太大，保持这些规则只会制造噪音。
select = ["E", "F", "W", "B"]
# 行长（E501）是纯排版噪音，忽略；代码库历史长行太多
ignore = ["E501"]

# FastAPI 的 Depends/File/Query 等是声明式"不可变调用"，属于标准用法，
# 不是 bugbear 说的"默认参数里做函数调用"，显式豁免，避免几百处误报。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.security.HTTPBearer",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的导入视为包再导出，不报 F401（代替已废弃的 ignore-init-module-imports）
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 禁用 pytest 缓存：Windows 上 .pytest_cache 目录权限异常会导致每次运行报
# PytestCacheWarning（WinError 5 拒绝访问），本项目不需要 --lf/--ff 等缓存功能。
addopts = "-p no:cacheprovider"
# 屏蔽第三方包（jieba 等）的无效转义序列 SyntaxWarning，避免测试输出刷屏；
# 本项目代码的转义问题已由 ruff W605 把关。
filterwarnings = [
  "ignore:invalid escape sequence.*:SyntaxWarning",
]
