[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-backend"
version = "0.1.0"
description = "Lumi multi-agent backend service"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "captcha>=0.6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "content>=0.0.1",
    "sentence-transformers>=5.7.0",
    "torch==2.13.0+cu126",
    "torchvision==0.28.0+cu126",
    "docling>=2.118.0",
    "jieba>=0.42.1",
    # ── 语音（ASR + TTS 兜底）──
    "openai-whisper>=20250625",
    "edge-tts>=7.0",
    "dashscope>=1.20",
    "imageio-ffmpeg>=0.5",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
# torch 必须用 CUDA 版（PyPI 上是 CPU 版，uv sync 会把它覆盖导致嵌入模型无法用 GPU）
torch = { url = "https://mirrors.aliyun.com/pytorch-wheels/cu126/torch-2.13.0%2Bcu126-cp313-cp313-win_amd64.whl" }
torchvision = { url = "https://mirrors.aliyun.com/pytorch-wheels/cu126/torchvision-0.28.0%2Bcu126-cp313-cp313-win_amd64.whl" }

[tool.setuptools.packages.find]
include = ["app*", "celery_app*"]
exclude = ["tests*", "scripts*", "tools*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
